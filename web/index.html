<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLM 智能调度网关</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23007aff'/%3E%3Cpath d='M30 62c14 6 26 6 40-8M30 50c14 6 26 6 40-8M30 38c14 6 26 6 40-8' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=21">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16c5 2 11 2 16-4M4 12c5 2 11 2 16-4M4 8c5 2 11 2 16-4"/></svg>
      </span>
      <div class="brand-text">
        <div class="brand-name">调度中枢</div>
        <div class="brand-sub" id="verText">LLM Gateway</div>
      </div>
    </div>
    <div class="drag-strip pywebview-drag-region"></div>
    <div class="top-actions">
      <span id="modeBadge" class="badge badge-blue">智能路由</span>
      <button class="icon-btn" data-act="refresh" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg>
      </button>
      <button class="icon-btn" data-act="theme-cycle" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="win-btns" id="winBtns" hidden>
        <button class="wbtn" data-act="win-min" title="最小化">
          <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 6h8"/></svg>
        </button>
        <button class="wbtn" data-act="win-max" title="最大化/还原">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="wbtn wbtn-close" data-act="win-close" title="隐藏到托盘 / 退出">
          <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>
        </button>
      </span>
    </div>
  </div>
</header>

<div id="restart-banner"></div>
<main id="view" class="app"></main>

<nav class="tabbar"><div class="tabbar-inner" id="tabbar"></div></nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/utils.js?v=22"></script>
<script src="/js/state.js?v=22"></script>
<script src="/js/api.js?v=22"></script>
<script src="/js/icons.js?v=22"></script>
<script src="/js/sched.js?v=22"></script>
<script src="/js/render.js?v=22"></script>
<script src="/js/views.js?v=22"></script>
<script src="/js/drag.js?v=22"></script>
<script src="/js/events.js?v=22"></script>
</body>
</html>
